# TMS320C28x CPU and Instruction Set (Rev. F)
#
# Transcribed from the TI manual by scripts/spec_transcribe.py.
# Digits in the printed opcode are fixed bits; letters are operand fields,
# which is the part asm2000 and dis2000 cannot tell us.
# NOTE: a field printed as a word (COND) appears as one entry per letter;
# the bit span is still correct. See _fields() in the script.
# `operation` is TI's own notation for what the instruction computes, quoted
# verbatim. It is a reading aid, not a gate: see _operation() for why.
# Regenerate with: nix develop -c python3 scripts/spec_transcribe.py

instructions:
  - syntax: 'ABORTI'
    format: 16
    opcode: 0x0001
    mask: 0xFFFF
    bit_pattern: ['0000000000000001']
    objmode: 'X'
    rpt: '–'
    cyc: '2'
    flags: ['DBGM']
  - syntax: 'ABS ACC'
    format: 16
    opcode: 0xFF56
    mask: 0xFFFF
    bit_pattern: ['1111111101010110']
    objmode: 'X'
    rpt: '–'
    cyc: '1'
    flags: ['N', 'Z', 'C', 'V', 'OVM']
    operation:
      - 'V = 1'
      - 'ACC = 0x7FFF FFFF'
      - 'ACC = 0x8000 0000'
      - 'ACC = −ACC'
  - syntax: 'ABSTC ACC'
    format: 16
    opcode: 0x565F
    mask: 0xFFFF
    bit_pattern: ['0101011001011111']
    objmode: '1'
    rpt: '–'
    cyc: '1'
    flags: ['N', 'Z', 'C', 'V', 'TC', 'OVM']
    operation:
      - 'ACC = 0x7FFF FFFF'
      - 'ACC = 0x8000 0000'
      - 'V = 1'
      - 'TC = TC XOR 1'
      - 'ACC = −ACC'
      - 'TC = TC XOR 1'
      - 'C = 0'
  - syntax: 'ADD ACC,#16bit<<#0..15'
    format: 32
    opcode: 0xFF100000
    mask: 0xFFF00000
    bit_pattern: ['111111110001SHFT', 'CCCCCCCCCCCCCCCC']
    fields:
      C: { bits: [15, 0] }
      F: { bits: [17, 17] }
      H: { bits: [18, 18] }
      S: { bits: [19, 19] }
      T: { bits: [16, 16] }
    objmode: 'X'
    rpt: '–'
    cyc: '1'
    flags: ['Z', 'N', 'C', 'V', 'OVC', 'SXM', 'OVM']
    operation:
      - 'ACC = ACC + S:16bit << shift value'
      - 'ACC = ACC + 0:16bit << shift value'
  - syntax: 'ADD ACC,loc16 <<T'
    format: 32
    opcode: 0x56230000
    mask: 0xFFFFFF00
    bit_pattern: ['0101011000100011', '00000000LLLLLLLL']
    fields:
      L: { bits: [7, 0] }
    objmode: '1'
    rpt: '–'
    cyc: 'N+1'
    flags: ['Z', 'N', 'C', 'V', 'OVC', 'SXM', 'OVM']
    operation:
      - 'ACC = ACC + S:[loc16] << T(3:0)'
      - 'ACC = ACC + 0:[loc16] << T(3:0)'
  - syntax: 'ADD AX, loc16'
    format: 16
    opcode: 0x9400
    mask: 0xFE00
    bit_pattern: ['1001010ALLLLLLLL']
    fields:
      A: { bits: [8, 8] }
      L: { bits: [7, 0] }
    objmode: 'X'
    rpt: '–'
    cyc: '1'
    flags: ['N', 'Z', 'C', 'V']
  - syntax: 'ADD loc16, AX'
    format: 16
    opcode: 0x7200
    mask: 0xFE00
    bit_pattern: ['0111001ALLLLLLLL']
    fields:
      A: { bits: [8, 8] }
      L: { bits: [7, 0] }
    objmode: 'X'
    rpt: '–'
    cyc: '1'
    flags: ['N', 'Z', 'C', 'V']
    operation:
      - '[loc16] = [loc16] + AX'
  - syntax: 'ADD loc16,#16bitSigned'
    format: 32
    opcode: 0x08000000
    mask: 0xFF000000
    bit_pattern: ['00001000LLLLLLLL', 'CCCCCCCCCCCCCCCC']
    fields:
      C: { bits: [15, 0] }
      L: { bits: [23, 16] }
    objmode: 'X'
    rpt: '–'
    cyc: '1'
    flags: ['N', 'Z', 'C', 'V']
    operation:
      - '[loc16] = [loc16] + 16bitSigned'
  - syntax: 'ADDB ACC,#8bit'
    format: 16
    opcode: 0x0900
    mask: 0xFF00
    bit_pattern: ['00001001CCCCCCCC']
    fields:
      C: { bits: [7, 0] }
    objmode: 'X'
    rpt: '–'
    cyc: '1'
    flags: ['Z', 'N', 'C', 'V', 'OVC', 'OVM']
    operation:
      - 'ACC = ACC + 0:8bit'
  - syntax: 'ADDB AX, #8bitSigned'
    format: 16
    opcode: 0x9C00
    mask: 0xFE00
    bit_pattern: ['1001110ACCCCCCCC']
    fields:
      A: { bits: [8, 8] }
      C: { bits: [7, 0] }
    objmode: 'X'
    rpt: '–'
    cyc: '1'
    flags: ['N', 'Z', 'C', 'V']
    operation:
      - 'AX = AX + S:8bit'
  - syntax: 'ADDB SP, #7bit'
    format: 16
    opcode: 0xFE00
    mask: 0xFF80
    bit_pattern: ['111111100CCCCCCC']
    fields:
      C: { bits: [6, 0] }
    objmode: 'X'
    rpt: '–'
    cyc: '1'
    operation:
      - 'SP = SP + 0:7bit'
  - syntax: 'ADDB XARn, #7bit'
    format: 16
    opcode: 0xD800
    mask: 0xF880
    bit_pattern: ['11011nnn0CCCCCCC']
    fields:
      C: { bits: [6, 0] }
      n: { bits: [10, 8] }
    objmode: 'X'
    rpt: '–'
    cyc: '1'
    operation:
      - 'XARn = XARn + 0:7bit'
  - syntax: 'ADDCL ACC,loc32'
    format: 32
    opcode: 0x56400000
    mask: 0xFFFF0000
    bit_pattern: ['0101011001000000', 'xxxxxxxxLLLLLLLL']
    fields:
      L: { bits: [7, 0] }
      x: { bits: [15, 8] }
    objmode: '1'
    rpt: '–'
    cyc: '1'
    flags: ['Z', 'N', 'C', 'V', 'OVC', 'OVM']
    operation:
      - 'ACC = ACC + [loc32] + C'
  - syntax: 'ADDCU ACC,loc16'
    format: 16
    opcode: 0x0C00
    mask: 0xFF00
    bit_pattern: ['00001100LLLLLLLL']
    fields:
      L: { bits: [7, 0] }
    objmode: 'X'
    rpt: '–'
    cyc: '1'
    flags: ['Z', 'N', 'C', 'V', 'OVC', 'OVM']
    operation:
      - 'ACC = ACC + 0:[loc16] + C'
  - syntax: 'ADDL ACC,loc32'
    format: 16
    opcode: 0x0700
    mask: 0xFF00
    bit_pattern: ['00000111LLLLLLLL']
    fields:
      L: { bits: [7, 0] }
    objmode: 'X'
    rpt: 'Y'
    cyc: 'N+1'
    flags: ['N', 'Z', 'C', 'V', 'OVC', 'OVM']
    operation:
      - 'ACC = ACC + [loc32]'
  - syntax: 'ADDL ACC,P << PM'
    format: 16
    opcode: 0x10AC
    mask: 0xFFFF
    bit_pattern: ['0001000010101100']
    objmode: 'X'
    rpt: 'Y'
    cyc: 'N+1'
    flags: ['Z', 'N', 'C', 'V', 'OVM', 'PM']
    operation:
      - 'ACC = ACC + P << PM'
  - syntax: 'ADDL loc32,ACC'
    format: 32
    opcode: 0x56010000
    mask: 0xFFFFFF00
    bit_pattern: ['0101011000000001', '00000000LLLLLLLL']
    fields:
      L: { bits: [7, 0] }
    objmode: '1'
    rpt: '–'
    cyc: '1'
    flags: ['N', 'Z', 'C', 'V', 'OVM']
    operation:
      - '[loc32] = [loc32] + ACC'
  - syntax: 'ADDU ACC,loc16'
    format: 16
    opcode: 0x0D00
    mask: 0xFF00
    bit_pattern: ['00001101LLLLLLLL']
    fields:
      L: { bits: [7, 0] }
    objmode: 'X'
    rpt: 'Y'
    cyc: 'N+1'
    flags: ['Z', 'N', 'C', 'V', 'OVC', 'OVM']
    operation:
      - 'ACC = ACC + 0:[loc16]'
  - syntax: 'ADDUL P,loc32'
    format: 32
    opcode: 0x56570000
    mask: 0xFFFFFF00
    bit_pattern: ['0101011001010111', '00000000LLLLLLLL']
    fields:
      L: { bits: [7, 0] }
    objmode: '1'
    rpt: '–'
    cyc: '1'
    flags: ['N', 'Z', 'C', 'V']
    operation:
      - 'P = P + [loc32]'
  - syntax: 'ADDUL ACC, loc32'
    format: 32
    opcode: 0x56530000
    mask: 0xFFFF0000
    bit_pattern: ['0101011001010011', 'xxxxxxxxLLLLLLLL']
    fields:
      L: { bits: [7, 0] }
      x: { bits: [15, 8] }
    objmode: '1'
    rpt: 'Y'
    cyc: 'N+1'
    flags: ['Z', 'N', 'C', 'V']
    operation:
      - 'ACC = ACC + [loc32]'
  - syntax: 'ADRK #8bit'
    format: 16
    opcode: 0xFC00
    mask: 0xFF00
    bit_pattern: ['11111100IIIIIIII']
    fields:
      I: { bits: [7, 0] }
    objmode: 'X'
    rpt: '–'
    cyc: '1'
    flags: ['ARP']
    operation:
      - 'XAR(ARP) = XAR(ARP) + 0:8bit'
  - syntax: 'AND ACC, loc16'
    format: 16
    opcode: 0x8900
    mask: 0xFF00
    bit_pattern: ['10001001LLLLLLLL']
    fields:
      L: { bits: [7, 0] }
    objmode: '1'
    rpt: 'Y'
    cyc: 'N+1'
    flags: ['N', 'Z']
    operation:
      - 'ACC = ACC AND 0:[loc16]'
  - syntax: 'AND AX, loc16, #16bit'
    format: 32
    opcode: 0xCC000000
    mask: 0xFE000000
    bit_pattern: ['1100110ALLLLLLLL', 'CCCCCCCCCCCCCCCC']
    fields:
      A: { bits: [24, 24] }
      C: { bits: [15, 0] }
      L: { bits: [23, 16] }
    objmode: 'X'
    rpt: '–'
    cyc: '1'
    flags: ['N', 'Z']
    operation:
      - 'AX = [loc16] AND 16bit'
  - syntax: 'AND IER,#16bit'
    format: 32
    opcode: 0x76260000
    mask: 0xFFFF0000
    bit_pattern: ['0111011000100110', 'CCCCCCCCCCCCCCCC']
    fields:
      C: { bits: [15, 0] }
    objmode: 'X'
    rpt: '–'
    cyc: '2'
    operation:
      - 'IER = IER AND #16bit'
  - syntax: 'AND IFR,#16bit'
    format: 32
    opcode: 0x762F0000
    mask: 0xFFFF0000
    bit_pattern: ['0111011000101111', 'CCCCCCCCCCCCCCCC']
    fields:
      C: { bits: [15, 0] }
    objmode: 'X'
    rpt: '–'
    cyc: '2'
    operation:
      - 'IFR = IFR AND #16bit'
  - syntax: 'AND loc16, AX'
    format: 16
    opcode: 0xC000
    mask: 0xFE00
    bit_pattern: ['1100000ALLLLLLLL']
    fields:
      A: { bits: [8, 8] }
      L: { bits: [7, 0] }
    objmode: 'X'
    rpt: '–'
    cyc: '1'
    flags: ['N', 'Z']
    operation:
      - '[loc16] = [loc16] AND AX'
  - syntax: 'AND AX, loc16'
    format: 16
    opcode: 0xCE00
    mask: 0xFE00
    bit_pattern: ['1100111ALLLLLLLL']
    fields:
      A: { bits: [8, 8] }
      L: { bits: [7, 0] }
    objmode: 'X'
    rpt: '–'
    cyc: '1'
    flags: ['N', 'Z']
    operation:
      - 'AX = AX AND 16bit'
  - syntax: 'AND loc16,#16bitSigned'
    format: 32
    opcode: 0x18000000
    mask: 0xFF000000
    bit_pattern: ['00011000LLLLLLLL', 'CCCCCCCCCCCCCCCC']
    fields:
      C: { bits: [15, 0] }
      L: { bits: [23, 16] }
    objmode: 'X'
    rpt: '–'
    cyc: '1'
    flags: ['N', 'Z']
    operation:
      - '[loc16] = [loc16] AND 16bit'
  - syntax: 'ANDB AX, #8bit'
    format: 16
    opcode: 0x9000
    mask: 0xFE00
    bit_pattern: ['1001000ACCCCCCCC']
    fields:
      A: { bits: [8, 8] }
      C: { bits: [7, 0] }
    objmode: 'X'
    rpt: '–'
    cyc: '1'
    flags: ['N', 'Z']
    operation:
      - 'AX = AX AND 0:8bit'
  - syntax: 'ASP'
    format: 16
    opcode: 0x761B
    mask: 0xFFFF
    bit_pattern: ['0111011000011011']
    objmode: 'X'
    rpt: '–'
    cyc: '1'
    flags: ['SPA']
    operation:
      - 'SP = SP + 1'
      - 'SPA = 1;else'
      - 'SPA = 0'
  - syntax: 'ASR AX,#1...16'
    format: 16
    opcode: 0xFFA0
    mask: 0xFFE0
    bit_pattern: ['11111111101ASHFT']
    fields:
      A: { bits: [4, 4] }
      F: { bits: [1, 1] }
      H: { bits: [2, 2] }
      S: { bits: [3, 3] }
      T: { bits: [0, 0] }
    objmode: 'X'
    rpt: '–'
    cyc: '1'
    flags: ['N', 'Z', 'C']
  - syntax: 'ASR AX,T'
    format: 16
    opcode: 0xFF64
    mask: 0xFFFE
    bit_pattern: ['111111110110010A']
    fields:
      A: { bits: [0, 0] }
    objmode: 'X'
    rpt: '–'
    cyc: '1'
    flags: ['N', 'Z', 'C']
  - syntax: 'ASR64 ACC:P,#1..16'
    format: 16
    opcode: 0x5680
    mask: 0xFFF0
    bit_pattern: ['010101101000SHFT']
    fields:
      F: { bits: [1, 1] }
      H: { bits: [2, 2] }
      S: { bits: [3, 3] }
      T: { bits: [0, 0] }
    objmode: '1'
    rpt: '–'
    cyc: '1'
    flags: ['N', 'Z', 'C']
  - syntax: 'ASR64 ACC:P,T'
    format: 16
    opcode: 0x562C
    mask: 0xFFFF
    bit_pattern: ['0101011000101100']
    objmode: '1'
    rpt: '–'
    cyc: '1'
    flags: ['N', 'Z', 'C']
  - syntax: 'ASRL ACC,T'
    format: 16
    opcode: 0x5610
    mask: 0xFFFF
    bit_pattern: ['0101011000010000']
    objmode: '1'
    rpt: '–'
    cyc: '1'
    flags: ['Z', 'N', 'C']
    operation:
      - 'During the shift, the value is sign extended. If T specifies a shift of 0, then C is cleared'
  - syntax: 'B 16bitOffset,COND'
    format: 32
    opcode: 0xFFE00000
    mask: 0xFFF00000
    bit_pattern: ['111111111110COND', 'CCCCCCCCCCCCCCCC']
    fields:
      C: { bits: [19, 0], contiguous: false }
      D: { bits: [16, 16] }
      N: { bits: [17, 17] }
      O: { bits: [18, 18] }
    objmode: 'X'
    rpt: '–'
    cyc: '7/4'
  - syntax: 'BANZ 16bitOffset,ARn− −'
    format: 32
    opcode: 0x00080000
    mask: 0xFFF80000
    bit_pattern: ['0000000000001nnn', 'CCCCCCCCCCCCCCCC']
    fields:
      C: { bits: [15, 0] }
      n: { bits: [18, 16] }
    objmode: 'X'
    rpt: '–'
    cyc: '4/2'
    operation:
      - 'PC = PC + signed 16-bit offset'
      - 'ARn = ARn - 1'
      - 'ARnH = unchanged'
  - syntax: 'BF 16bitOffset,COND'
    format: 32
    opcode: 0x56C00000
    mask: 0xFFF00000
    bit_pattern: ['010101101100COND', 'CCCCCCCCCCCCCCCC']
    fields:
      C: { bits: [19, 0], contiguous: false }
      D: { bits: [16, 16] }
      N: { bits: [17, 17] }
      O: { bits: [18, 18] }
    objmode: '1'
    rpt: '–'
    cyc: '4/4'
  - syntax: 'C27MAP'
    format: 16
    opcode: 0x563F
    mask: 0xFFFF
    bit_pattern: ['0101011000111111']
    objmode: 'X'
    rpt: '–'
    cyc: '5'
    flags: ['M0M1MAP']
  - syntax: 'C27OBJ'
    format: 16
    opcode: 0x5636
    mask: 0xFFFF
    bit_pattern: ['0101011000110110']
    objmode: 'X'
    rpt: '–'
    cyc: '5'
  - syntax: 'C28ADDR'
    format: 16
    opcode: 0x5616
    mask: 0xFFFF
    bit_pattern: ['0101011000010110']
    objmode: 'X'
    rpt: '–'
    cyc: '1'
  - syntax: 'C28MAP'
    format: 16
    opcode: 0x561A
    mask: 0xFFFF
    bit_pattern: ['0101011000011010']
    objmode: 'X'
    rpt: '–'
    cyc: '5'
    flags: ['M0M1MAP']
  - syntax: 'C28OBJ'
    format: 16
    opcode: 0x561F
    mask: 0xFFFF
    bit_pattern: ['0101011000011111']
    objmode: 'X'
    rpt: '–'
    cyc: '5'
  - syntax: 'CLRC OVC'
    format: 16
    opcode: 0x565C
    mask: 0xFFFF
    bit_pattern: ['0101011001011100']
    objmode: '1'
    rpt: '–'
    cyc: '1'
    flags: ['OVC']
  - syntax: 'CLRC XF'
    format: 16
    opcode: 0x561B
    mask: 0xFFFF
    bit_pattern: ['0101011000011011']
    objmode: 'X'
    rpt: '–'
    cyc: '1'
    flags: ['XF']
  - syntax: 'CMP AX, loc16'
    format: 16
    opcode: 0x5400
    mask: 0xFE00
    bit_pattern: ['0101010ALLLLLLLL']
    fields:
      A: { bits: [8, 8] }
      L: { bits: [7, 0] }
    objmode: 'X'
    rpt: '–'
    cyc: '1'
    flags: ['N', 'Z', 'C']
    operation:
      - 'Set Flags On (AX − [loc16])'
  - syntax: 'CMP loc16,#16bitSigned'
    format: 32
    opcode: 0x1B000000
    mask: 0xFF000000
    bit_pattern: ['00011011LLLLLLLL', 'CCCCCCCCCCCCCCCC']
    fields:
      C: { bits: [15, 0] }
      L: { bits: [23, 16] }
    objmode: 'X'
    rpt: '–'
    cyc: '1'
    flags: ['N', 'Z', 'C']
    operation:
      - 'Modify flags on ([loc16] − 16bitSigned)'
  - syntax: 'CMP64 ACC:P'
    format: 16
    opcode: 0x565E
    mask: 0xFFFF
    bit_pattern: ['0101011001011110']
    objmode: '1'
    rpt: '–'
    cyc: '1'
    flags: ['N', 'Z', 'V']
    operation:
      - 'N = 0'
      - 'N = 1'
      - 'N = 1'
      - 'N = 0'
      - 'Z = 1'
      - 'Z = 0'
      - 'V = 0'
  - syntax: 'CMPB AX, #8bit'
    format: 16
    opcode: 0x5200
    mask: 0xFE00
    bit_pattern: ['0101001ACCCCCCCC']
    fields:
      A: { bits: [8, 8] }
      C: { bits: [7, 0] }
    objmode: 'X'
    rpt: '–'
    cyc: '1'
    flags: ['N', 'Z', 'C']
    operation:
      - 'Set Flags On (AX − 0:8bit)'
  - syntax: 'CMPL ACC,loc32'
    format: 16
    opcode: 0x0F00
    mask: 0xFF00
    bit_pattern: ['00001111LLLLLLLL']
    fields:
      L: { bits: [7, 0] }
    objmode: 'X'
    rpt: '–'
    cyc: '1'
    flags: ['N', 'Z', 'C']
    operation:
      - 'Modify flags on (ACC − [loc32])'
  - syntax: 'CMPL ACC,P << PM'
    format: 16
    opcode: 0xFF59
    mask: 0xFFFF
    bit_pattern: ['1111111101011001']
    objmode: 'X'
    rpt: '–'
    cyc: '1'
    flags: ['N', 'Z', 'C', 'PM']
    operation:
      - 'Modify flags on (ACC − [P << PM])'
  - syntax: 'CSB ACC'
    format: 16
    opcode: 0x5635
    mask: 0xFFFF
    bit_pattern: ['0101011000110101']
    objmode: '1'
    rpt: '–'
    cyc: '1'
    flags: ['N', 'Z', 'TC']
    operation:
      - 'T = 0, 1 sign bit'
      - 'T = 1, 2 sign bits'
      - 'T = 31, 32 sign bits'
  - syntax: 'DEC loc16'
    format: 16
    opcode: 0x0B00
    mask: 0xFF00
    bit_pattern: ['00001011LLLLLLLL']
    fields:
      L: { bits: [7, 0] }
    objmode: 'X'
    rpt: '–'
    cyc: '1'
    flags: ['N', 'Z', 'C', 'V']
  - syntax: 'DINT'
    format: 16
    opcode: 0x3B10
    mask: 0xFFFF
    bit_pattern: ['0011101100010000']
    objmode: 'X'
    rpt: '–'
    cyc: '2'
    flags: ['INTM']
  - syntax: 'DMOV loc16'
    format: 16
    opcode: 0xA500
    mask: 0xFF00
    bit_pattern: ['10100101LLLLLLLL']
    fields:
      L: { bits: [7, 0] }
    objmode: '1'
    rpt: 'Y'
    cyc: 'N+1'
    operation:
      - 'loc16 + 1] = [loc16]'
  - syntax: 'EALLOW'
    format: 16
    opcode: 0x7622
    mask: 0xFFFF
    bit_pattern: ['0111011000100010']
    objmode: 'X'
    rpt: '–'
    cyc: '4'
    flags: ['EALLOW']
  - syntax: 'EDIS'
    format: 16
    opcode: 0x761A
    mask: 0xFFFF
    bit_pattern: ['0111011000011010']
    objmode: 'X'
    rpt: '–'
    cyc: '4'
    flags: ['EALLOW']
  - syntax: 'EINT'
    format: 16
    opcode: 0x2910
    mask: 0xFFFF
    bit_pattern: ['0010100100010000']
    objmode: 'X'
    rpt: '–'
    cyc: '2'
    flags: ['INTM']
  - syntax: 'ESTOP0'
    format: 16
    opcode: 0x7625
    mask: 0xFFFF
    bit_pattern: ['0111011000100101']
    objmode: 'X'
    rpt: '–'
    cyc: '4'
  - syntax: 'ESTOP1'
    format: 16
    opcode: 0x7624
    mask: 0xFFFF
    bit_pattern: ['0111011000100100']
    objmode: 'X'
    rpt: '–'
    cyc: '1'
  - syntax: 'FFC XAR7,22bit'
    format: 32
    opcode: 0x00C00000
    mask: 0xFFC00000
    bit_pattern: ['0000000011CCCCCC', 'CCCCCCCCCCCCCCCC']
    fields:
      C: { bits: [21, 0] }
    objmode: 'X'
    rpt: '–'
    cyc: '4'
    operation:
