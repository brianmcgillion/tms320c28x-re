# TMS320C28x Move Instructions
# Opcodes from INL bn-tic28x-arch opcodes.h (MIT)

instructions:
  # --- AX / ACC general moves ---
  - name: MOV_AX_LOC16
    full_name: "Move loc16 to AX"
    mnemonic: MOV
    operand_text: "{0}, {1:@AH|AL}"
    format: 16
    opcode: 0x9200
    mask: 0xFE00
    objmode: 1
    operands:
      - { name: ax, type: ax, bits: [8, 8] }
      - { name: loc16, type: loc16, bits: [7, 0] }
    semantics: { type: mov, dest: "AX", src: "loc16" }

  - name: MOV_LOC16_AX
    full_name: "Move AX to loc16"
    mnemonic: MOV
    operand_text: "{0}, {1}"
    format: 16
    opcode: 0x9600
    mask: 0xFE00
    objmode: 1
    operands:
      - { name: loc16, type: loc16, bits: [7, 0] }
      - { name: ax, type: ax, bits: [8, 8] }
    semantics: { type: mov, dest: "loc16", src: "AX" }

  - name: MOV_ACC_LOC16
    full_name: "Move loc16 to ACC (sign-extended)"
    mnemonic: MOV
    operand_text: "ACC, {0}"
    format: 16
    opcode: 0x8500
    mask: 0xFF00
    objmode: 1
    operands:
      - { name: loc16, type: loc16, bits: [7, 0] }
    semantics: { type: mov, dest: ACC, src: "sign_extend(loc16)", flags: [N, Z] }

  - name: MOV_ACC_CONST16_SHIFT
    full_name: "Move 16-bit constant shifted to ACC"
    mnemonic: MOV
    operand_text: "ACC, {0} << {1:b} | ACC, {0:d}"
    format: 32
    opcode: 0xFF200000
    mask: 0xFFF00000
    objmode: 1
    operands:
      - { name: const16, type: imm16, bits: [15, 0] }
      - { name: shift, type: shift4, bits: [19, 16] }
    semantics: { type: mov, dest: ACC, flags: [N, Z] }

  - name: MOV_LOC16_CONST16
    full_name: "Move 16-bit constant to loc16"
    mnemonic: MOV
    operand_text: "{0}, {1:04x}"
    format: 32
    opcode: 0x28000000
    mask: 0xFF000000
    objmode: 1
    operands:
      - { name: loc16, type: loc16, bits: [23, 16] }
      - { name: const16, type: imm16, bits: [15, 0] }
    semantics: { type: mov, dest: "loc16", src: "const16" }

  - name: MOV_ACC_LOC16_SHIFT16
    full_name: "Move loc16 to high half of ACC"
    mnemonic: MOV
    operand_text: "ACC, {0} << 16"
    format: 16
    opcode: 0x2500
    mask: 0xFF00
    objmode: 1
    operands:
      - { name: loc16, type: loc16, bits: [7, 0] }
    semantics: { type: mov, dest: ACC, flags: [N, Z] }

  - name: MOV_LOC16_ACC_SHIFT1
    full_name: "Move ACC>>1 to loc16"
    mnemonic: MOV
    operand_text: "{0}, ACC << 1"
    format: 16
    opcode: 0xB100
    mask: 0xFF00
    objmode: 1
    operands:
      - { name: loc16, type: loc16, bits: [7, 0] }
    semantics: { type: mov }

  - name: MOVH_LOC16_ACC_SHIFT1
    full_name: "Move high ACC>>1 to loc16"
    mnemonic: MOVH
    operand_text: "{0}, ACC << 1"
    format: 16
    opcode: 0xB300
    mask: 0xFF00
    objmode: 1
    operands:
      - { name: loc16, type: loc16, bits: [7, 0] }
    semantics: { type: mov }

  - name: MOVH_LOC16_P
    full_name: "Move PH to loc16"
    mnemonic: MOVH
    operand_text: "{0}, P"
    format: 16
    opcode: 0x5700
    mask: 0xFF00
    objmode: 1
    operands:
      - { name: loc16, type: loc16, bits: [7, 0] }
    semantics: { type: mov }

  - name: MOV_LOC16_0
    full_name: "Move zero to loc16"
    mnemonic: MOV
    operand_text: "{0}, #0"
    format: 16
    opcode: 0x2B00
    mask: 0xFF00
    objmode: 1
    operands:
      - { name: loc16, type: loc16, bits: [7, 0] }
    semantics: { type: mov, src: 0 }

  # --- DP moves ---
  - name: MOV_DP_CONST10
    full_name: "Move 10-bit constant to DP"
    mnemonic: MOV
    operand_text: "DP, {0}"
    format: 16
    opcode: 0xF800
    mask: 0xFC00
    objmode: 1
    operands:
      - { name: const10, type: imm10, bits: [9, 0] }
    semantics: { type: mov, dest: DP }

  - name: MOVZ_DP_CONST10
    full_name: "Move 10-bit constant to DP, zero-extended (clears DP[15:10])"
    mnemonic: MOVZ
    operand_text: "DP, {0}"
    format: 16
    opcode: 0xB800
    mask: 0xFC00
    objmode: 1
    operands:
      - { name: const10, type: imm10, bits: [9, 0] }
    semantics: { type: mov, dest: DP }

  - name: MOVW_DP_CONST16
    full_name: "Move 16-bit constant to DP"
    mnemonic: MOVW
    operand_text: "DP, {0}"
    format: 32
    opcode: 0x761F0000
    mask: 0xFFFF0000
    objmode: 1
    operands:
      - { name: const16, type: imm16, bits: [15, 0] }
    semantics: { type: mov, dest: DP }

  # --- MOVB (byte) ---
  - name: MOVB_AX_CONST8
    full_name: "Move 8-bit constant to AX"
    mnemonic: MOVB
    operand_text: "{0}, {1}"
    format: 16
    opcode: 0x9A00
    mask: 0xFE00
    objmode: 1
    operands:
      - { name: ax, type: ax, bits: [8, 8] }
      - { name: const8, type: imm8, bits: [7, 0] }
    semantics: { type: mov }

  - name: MOVB_ACC_CONST8
    full_name: "Move 8-bit constant to ACC"
    mnemonic: MOVB
    operand_text: "ACC, {0:d}"
    format: 16
    opcode: 0x0200
    mask: 0xFF00
    objmode: 1
    operands:
      - { name: const8, type: imm8, bits: [7, 0] }
    semantics: { type: mov, dest: ACC, flags: [N, Z] }

  - name: MOVB_XAR0_CONST8
    full_name: "Move 8-bit constant to XAR0"
    mnemonic: MOVB
    operand_text: "XAR0, {0}"
    format: 16
    opcode: 0xD000
    mask: 0xFF00
    operands:
      - { name: const8, type: imm8, bits: [7, 0] }
    semantics: { type: mov, dest: XAR0 }

  - name: MOVB_XAR1_CONST8
    full_name: "Move 8-bit constant to XAR1"
    mnemonic: MOVB
    operand_text: "XAR1, {0}"
    format: 16
    opcode: 0xD100
    mask: 0xFF00
    operands:
      - { name: const8, type: imm8, bits: [7, 0] }
    semantics: { type: mov, dest: XAR1 }

  - name: MOVB_XAR2_CONST8
    full_name: "Move 8-bit constant to XAR2"
    mnemonic: MOVB
    operand_text: "XAR2, {0}"
    format: 16
    opcode: 0xD200
    mask: 0xFF00
    operands:
      - { name: const8, type: imm8, bits: [7, 0] }
    semantics: { type: mov, dest: XAR2 }

  - name: MOVB_XAR3_CONST8
    full_name: "Move 8-bit constant to XAR3"
    mnemonic: MOVB
    operand_text: "XAR3, {0}"
    format: 16
    opcode: 0xD300
    mask: 0xFF00
    operands:
      - { name: const8, type: imm8, bits: [7, 0] }
    semantics: { type: mov, dest: XAR3 }

  - name: MOVB_XAR4_CONST8
    full_name: "Move 8-bit constant to XAR4"
    mnemonic: MOVB
    operand_text: "XAR4, {0}"
    format: 16
    opcode: 0xD400
    mask: 0xFF00
    operands:
      - { name: const8, type: imm8, bits: [7, 0] }
    semantics: { type: mov, dest: XAR4 }

  - name: MOVB_XAR5_CONST8
    full_name: "Move 8-bit constant to XAR5"
    mnemonic: MOVB
    operand_text: "XAR5, {0}"
    format: 16
    opcode: 0xD500
    mask: 0xFF00
    operands:
      - { name: const8, type: imm8, bits: [7, 0] }
    semantics: { type: mov, dest: XAR5 }

  - name: MOVB_XAR6_CONST8
    full_name: "Move 8-bit constant to XAR6"
    mnemonic: MOVB
    operand_text: "XAR6, {0:02x}"
    format: 16
    opcode: 0xBE00
    mask: 0xFF00
    operands:
      - { name: const8, type: imm8, bits: [7, 0] }
    semantics: { type: mov, dest: XAR6 }

  - name: MOVB_XAR7_CONST8
    full_name: "Move 8-bit constant to XAR7"
    mnemonic: MOVB
    operand_text: "XAR7, {0:02x}"
    format: 16
    opcode: 0xB600
    mask: 0xFF00
    operands:
      - { name: const8, type: imm8, bits: [7, 0] }
    semantics: { type: mov, dest: XAR7 }

  - name: MOVB_AR6_CONST8
    full_name: "Move 8-bit constant to AR6"
    mnemonic: MOVB
    operand_text: "AR6, {0}"
    format: 16
    opcode: 0xD600
    mask: 0xFF00
    operands:
      - { name: const8, type: imm8, bits: [7, 0] }
    semantics: { type: mov, dest: AR6 }

  - name: MOVB_AR7_CONST8
    full_name: "Move 8-bit constant to AR7"
    mnemonic: MOVB
    operand_text: "AR7, {0}"
    format: 16
    opcode: 0xD700
    mask: 0xFF00
    operands:
      - { name: const8, type: imm8, bits: [7, 0] }
    semantics: { type: mov, dest: AR7 }

  - name: MOVB_AXLSB_LOC16
    full_name: "Move low byte of loc16 to AX LSB"
    mnemonic: MOVB
    operand_text: "{0}.LSB, {1}"
    format: 16
    opcode: 0xC600
    mask: 0xFE00
    objmode: 1
    operands:
      - { name: ax, type: ax, bits: [8, 8] }
      - { name: loc16, type: loc16, bits: [7, 0] }
    semantics: { type: mov }

  - name: MOVB_AXMSB_LOC16
    full_name: "Move low byte of loc16 to AX MSB"
    mnemonic: MOVB
    operand_text: "{0}.MSB, {1}"
    format: 16
    opcode: 0x3800
    mask: 0xFE00
    objmode: 1
    operands:
      - { name: ax, type: ax, bits: [8, 8] }
      - { name: loc16, type: loc16, bits: [7, 0] }
    semantics: { type: mov }

  - name: MOVB_LOC16_AXLSB
    full_name: "Move AX LSB to loc16"
    mnemonic: MOVB
    operand_text: "{0}, {1}.LSB"
    format: 16
    opcode: 0x3C00
    mask: 0xFE00
    objmode: 1
    operands:
      - { name: loc16, type: loc16, bits: [7, 0] }
      - { name: ax, type: ax, bits: [8, 8] }
    semantics: { type: mov }

  - name: MOVB_LOC16_AXMSB
    full_name: "Move AX MSB to loc16"
    mnemonic: MOVB
    operand_text: "{0}, {1}.MSB"
    format: 16
    opcode: 0xC800
    mask: 0xFE00
    objmode: 1
    operands:
      - { name: loc16, type: loc16, bits: [7, 0] }
      - { name: ax, type: ax, bits: [8, 8] }
    semantics: { type: mov }

  # --- MOVL (32-bit) ---
  - name: MOVL_ACC_LOC32
    full_name: "Move loc32 to ACC"
    mnemonic: MOVL
    operand_text: "ACC, {0}"
    format: 16
    opcode: 0x0600
    mask: 0xFF00
    objmode: 1
    operands:
      - { name: loc32, type: loc32, bits: [7, 0] }
    semantics: { type: mov, dest: ACC, flags: [N, Z] }

  - name: MOVL_LOC32_ACC
    full_name: "Move ACC to loc32"
    mnemonic: MOVL
    operand_text: "{0}, ACC"
    format: 16
    opcode: 0x1E00
    mask: 0xFF00
    objmode: 1
    operands:
      - { name: loc32, type: loc32, bits: [7, 0] }
    semantics: { type: mov, src: ACC }

  - name: MOVL_XAR0_CONST22
    full_name: "Move 22-bit constant to XAR0"
    mnemonic: MOVL
    operand_text: "XAR0, {0:06x}"
    format: 32
    opcode: 0x8D000000
    mask: 0xFFC00000
    operands: [{ name: const22, type: imm22, bits: [21, 0] }]
    semantics: { type: mov, dest: XAR0 }

  - name: MOVL_XAR1_CONST22
    full_name: "Move 22-bit constant to XAR1"
    mnemonic: MOVL
    operand_text: "XAR1, {0:06x}"
    format: 32
    opcode: 0x8D400000
    mask: 0xFFC00000
    operands: [{ name: const22, type: imm22, bits: [21, 0] }]
    semantics: { type: mov, dest: XAR1 }

  - name: MOVL_XAR2_CONST22
    full_name: "Move 22-bit constant to XAR2"
    mnemonic: MOVL
    operand_text: "XAR2, {0:06x}"
    format: 32
    opcode: 0x8D800000
    mask: 0xFFC00000
    operands: [{ name: const22, type: imm22, bits: [21, 0] }]
    semantics: { type: mov, dest: XAR2 }

  - name: MOVL_XAR3_CONST22
    full_name: "Move 22-bit constant to XAR3"
    mnemonic: MOVL
    operand_text: "XAR3, {0:06x}"
    format: 32
    opcode: 0x8DC00000
    mask: 0xFFC00000
    operands: [{ name: const22, type: imm22, bits: [21, 0] }]
    semantics: { type: mov, dest: XAR3 }

  - name: MOVL_XAR4_CONST22
    full_name: "Move 22-bit constant to XAR4"
    mnemonic: MOVL
    operand_text: "XAR4, {0:06x}"
    format: 32
    opcode: 0x8F000000
    mask: 0xFFC00000
    operands: [{ name: const22, type: imm22, bits: [21, 0] }]
    semantics: { type: mov, dest: XAR4 }

  - name: MOVL_XAR5_CONST22
    full_name: "Move 22-bit constant to XAR5"
    mnemonic: MOVL
    operand_text: "XAR5, {0:06x}"
    format: 32
    opcode: 0x8F400000
    mask: 0xFFC00000
    operands: [{ name: const22, type: imm22, bits: [21, 0] }]
    semantics: { type: mov, dest: XAR5 }

  - name: MOVL_XAR6_CONST22
    full_name: "Move 22-bit constant to XAR6"
    mnemonic: MOVL
    operand_text: "XAR6, {0:06x}"
    format: 32
    opcode: 0x76800000
    mask: 0xFFC00000
    operands: [{ name: const22, type: imm22, bits: [21, 0] }]
    semantics: { type: mov, dest: XAR6 }

  - name: MOVL_XAR7_CONST22
    full_name: "Move 22-bit constant to XAR7"
    mnemonic: MOVL
    operand_text: "XAR7, {0:06x}"
    format: 32
    opcode: 0x76C00000
    mask: 0xFFC00000
    operands: [{ name: const22, type: imm22, bits: [21, 0] }]
    semantics: { type: mov, dest: XAR7 }

  - name: MOVL_XAR0_LOC32
    full_name: "Move loc32 to XAR0"
    mnemonic: MOVL
    operand_text: "XAR0, {0}"
    format: 16
    opcode: 0x8E00
    mask: 0xFF00
    operands: [{ name: loc32, type: loc32, bits: [7, 0] }]
    semantics: { type: mov, dest: XAR0 }

  - name: MOVL_XAR1_LOC32
    full_name: "Move loc32 to XAR1"
    mnemonic: MOVL
    operand_text: "XAR1, {0}"
    format: 16
    opcode: 0x8B00
    mask: 0xFF00
    operands: [{ name: loc32, type: loc32, bits: [7, 0] }]
    semantics: { type: mov, dest: XAR1 }

  - name: MOVL_XAR2_LOC32
    full_name: "Move loc32 to XAR2"
    mnemonic: MOVL
    operand_text: "XAR2, {0}"
    format: 16
    opcode: 0x8600
    mask: 0xFF00
    operands: [{ name: loc32, type: loc32, bits: [7, 0] }]
    semantics: { type: mov, dest: XAR2 }

  - name: MOVL_XAR3_LOC32
    full_name: "Move loc32 to XAR3"
    mnemonic: MOVL
    operand_text: "XAR3, {0}"
    format: 16
    opcode: 0x8200
    mask: 0xFF00
    operands: [{ name: loc32, type: loc32, bits: [7, 0] }]
    semantics: { type: mov, dest: XAR3 }

  - name: MOVL_XAR4_LOC32
    full_name: "Move loc32 to XAR4"
    mnemonic: MOVL
    operand_text: "XAR4, {0}"
    format: 16
    opcode: 0x8A00
    mask: 0xFF00
    operands: [{ name: loc32, type: loc32, bits: [7, 0] }]
    semantics: { type: mov, dest: XAR4 }

  - name: MOVL_XAR5_LOC32
    full_name: "Move loc32 to XAR5"
    mnemonic: MOVL
    operand_text: "XAR5, {0}"
    format: 16
    opcode: 0x8300
    mask: 0xFF00
    operands: [{ name: loc32, type: loc32, bits: [7, 0] }]
    semantics: { type: mov, dest: XAR5 }

  - name: MOVL_XAR6_LOC32
    full_name: "Move loc32 to XAR6"
    mnemonic: MOVL
    operand_text: "XAR6, {0:@XAR6|XAR7}"
    format: 16
    opcode: 0xC400
    mask: 0xFF00
    operands: [{ name: loc32, type: loc32, bits: [7, 0] }]
    semantics: { type: mov, dest: XAR6 }

  - name: MOVL_XAR7_LOC32
    full_name: "Move loc32 to XAR7"
    mnemonic: MOVL
    operand_text: "XAR7, {0:@XAR6|XAR7}"
    format: 16
    opcode: 0xC500
    mask: 0xFF00
    operands: [{ name: loc32, type: loc32, bits: [7, 0] }]
    semantics: { type: mov, dest: XAR7 }

  - name: MOVL_LOC32_XAR0
    full_name: "Move XAR0 to loc32"
    mnemonic: MOVL
    operand_text: "{0}, XAR0"
    format: 16
    opcode: 0x3A00
    mask: 0xFF00
    operands: [{ name: loc32, type: loc32, bits: [7, 0] }]
    semantics: { type: mov, src: XAR0 }

  - name: MOVL_LOC32_XAR1
    full_name: "Move XAR1 to loc32"
    mnemonic: MOVL
    operand_text: "{0}, XAR1"
    format: 16
    opcode: 0xB200
    mask: 0xFF00
    operands: [{ name: loc32, type: loc32, bits: [7, 0] }]
    semantics: { type: mov, src: XAR1 }

  - name: MOVL_LOC32_XAR2
    full_name: "Move XAR2 to loc32"
    mnemonic: MOVL
    operand_text: "{0}, XAR2"
    format: 16
    opcode: 0xAA00
