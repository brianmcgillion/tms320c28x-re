  # MOV with absolute 16-bit addressing is MOV_LOC16_MEM16 / MOV_MEM16_LOC16
  # (0xF5 / 0xF4, system.yaml).  0xBF / 0xBD are MOV32 and VMOV32.

  - name: PUSH_RB
    full_name: "Push RB (repeat block register)"
    mnemonic: PUSH
    operand_text: "RB"
    format: 16
    opcode: 0xFFF0
    mask: 0xFFFF
    semantics: { type: push, src: RB }

  - name: POP_RB
    full_name: "Pop RB (repeat block register)"
    mnemonic: POP
    operand_text: "RB"
    format: 16
    opcode: 0xFFF1
    mask: 0xFFFF
    semantics: { type: pop, dest: RB }
