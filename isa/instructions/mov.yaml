    operands: [{ name: loc32, type: loc32, bits: [7, 0] }]
    semantics: { type: mov, src: XAR2 }

  - name: MOVL_LOC32_XAR3
    full_name: "Move XAR3 to loc32"
    mnemonic: MOVL
    operand_text: "{0}, XAR3"
    format: 16
    opcode: 0xA200
    mask: 0xFF00
    operands: [{ name: loc32, type: loc32, bits: [7, 0] }]
    semantics: { type: mov, src: XAR3 }

  - name: MOVL_LOC32_XAR4
    full_name: "Move XAR4 to loc32"
    mnemonic: MOVL
    operand_text: "{0}, XAR4"
    format: 16
    opcode: 0xA800
    mask: 0xFF00
    operands: [{ name: loc32, type: loc32, bits: [7, 0] }]
    semantics: { type: mov, src: XAR4 }

  - name: MOVL_LOC32_XAR5
    full_name: "Move XAR5 to loc32"
    mnemonic: MOVL
    operand_text: "{0}, XAR5"
    format: 16
    opcode: 0xA000
    mask: 0xFF00
    operands: [{ name: loc32, type: loc32, bits: [7, 0] }]
    semantics: { type: mov, src: XAR5 }

  - name: MOVL_LOC32_XAR6
    full_name: "Move XAR6 to loc32"
    mnemonic: MOVL
    operand_text: "{0}, XAR6"
    format: 16
    opcode: 0xC200
    mask: 0xFF00
    operands: [{ name: loc32, type: loc32, bits: [7, 0] }]
    semantics: { type: mov, src: XAR6 }

  - name: MOVL_LOC32_XAR7
    full_name: "Move XAR7 to loc32"
    mnemonic: MOVL
    operand_text: "{0}, XAR7"
    format: 16
    opcode: 0xC300
    mask: 0xFF00
    operands: [{ name: loc32, type: loc32, bits: [7, 0] }]
    semantics: { type: mov, src: XAR7 }

  - name: MOVL_LOC32_P
    full_name: "Move P to loc32"
    mnemonic: MOVL
    operand_text: "{0}, P"
    format: 16
    opcode: 0xA900
    mask: 0xFF00
    operands: [{ name: loc32, type: loc32, bits: [7, 0] }]
    lift: { dst: { opnd: 0 }, src: { reg: P }, width: 4 }
    semantics: { type: mov, src: P }

  - name: MOVL_LOC32_XT
    full_name: "Move XT to loc32"
    mnemonic: MOVL
    operand_text: "{0}, XT"
    format: 16
    opcode: 0xAB00
    mask: 0xFF00
    operands: [{ name: loc32, type: loc32, bits: [7, 0] }]
    lift: { dst: { opnd: 0 }, src: { reg: XT }, width: 4 }
    semantics: { type: mov, src: XT }

  - name: MOVL_P_LOC32
    full_name: "Move loc32 to P"
    mnemonic: MOVL
    operand_text: "P, {0}"
    format: 16
    opcode: 0xA300
    mask: 0xFF00
    operands: [{ name: loc32, type: loc32, bits: [7, 0] }]
    lift: { dst: { reg: P }, src: { opnd: 0 }, width: 4 }
    semantics: { type: mov, dest: P }

  - name: MOVL_P_ACC
    full_name: "Move ACC to P"
    mnemonic: MOVL
    operand_text: "P, ACC"
    format: 16
    opcode: 0xFF5A
    mask: 0xFFFF
    semantics: { type: mov, dest: P, src: ACC }

  - name: MOVL_XT_LOC32
    full_name: "Move loc32 to XT"
    mnemonic: MOVL
    operand_text: "XT, {0}"
    format: 16
    opcode: 0x8700
    mask: 0xFF00
    operands: [{ name: loc32, type: loc32, bits: [7, 0] }]
    lift: { dst: { reg: XT }, src: { opnd: 0 }, width: 4 }
    semantics: { type: mov, dest: XT }

  # --- MOVZ (zero-extend to ARn) ---
  - name: MOVZ_AR0_LOC16
