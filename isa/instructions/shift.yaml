# TMS320C28x Shift Instructions
# Opcodes from INL bn-tic28x-arch opcodes.h (MIT)

instructions:
  - name: LSL_ACC_SHIFT
    full_name: "Logical shift left ACC by immediate"
    format: 16
    opcode: 0xFF30
    mask: 0xFFF0
    operands:
      - { name: shift, type: imm4, bits: [3, 0] }
    semantics: { type: lsl, dest: ACC, flags: [N, Z, C] }

  - name: LSL_AX_SHIFT
    full_name: "Logical shift left AX by immediate"
    format: 16
    opcode: 0xFF80
    mask: 0xFFE0
    operands:
      - { name: ax, type: ax, bits: [4, 4] }
      - { name: shift, type: imm4, bits: [3, 0] }
    semantics: { type: lsl, flags: [N, Z, C] }

  - name: LSR_AX_SHIFT
    full_name: "Logical shift right AX by immediate"
    format: 16
    opcode: 0xFFC0
    mask: 0xFFE0
    operands:
      - { name: ax, type: ax, bits: [4, 4] }
      - { name: shift, type: imm4, bits: [3, 0] }
    semantics: { type: lsr, flags: [N, Z, C] }

  - name: ASR_AX_SHIFT
    full_name: "Arithmetic shift right AX by immediate"
    format: 16
    opcode: 0xFFA0
    mask: 0xFFE0
    operands:
      - { name: ax, type: ax, bits: [4, 4] }
      - { name: shift, type: imm4, bits: [3, 0] }
    semantics: { type: asr, flags: [N, Z, C] }

  - name: ROL_ACC
    full_name: "Rotate ACC left through carry"
    format: 16
    opcode: 0xFF53
    mask: 0xFFFF
    semantics: { type: rol, dest: ACC, flags: [N, Z, C] }

  - name: ROR_ACC
    full_name: "Rotate ACC right through carry"
    format: 16
    opcode: 0xFF52
    mask: 0xFFFF
    semantics: { type: ror, dest: ACC, flags: [N, Z, C] }

  - name: LSL_ACC_T
    full_name: "Logical shift left ACC by T register"
    format: 16
    opcode: 0xFF50
    mask: 0xFFFF
    semantics: { type: lsl, dest: ACC, src: T, flags: [N, Z, C] }

  - name: LSL_AX_T
    full_name: "Logical shift left AX by T register"
    format: 16
    opcode: 0xFF66
    mask: 0xFFFE
    operands:
      - { name: ax, type: ax, bits: [0, 0] }
    semantics: { type: lsl, flags: [N, Z, C] }

  - name: LSR_AX_T
    full_name: "Logical shift right AX by T register"
    format: 16
    opcode: 0xFF62
    mask: 0xFFFE
    operands:
      - { name: ax, type: ax, bits: [0, 0] }
    semantics: { type: lsr, flags: [N, Z, C] }

  - name: ASR_AX_T
    full_name: "Arithmetic shift right AX by T register"
    format: 16
    opcode: 0xFF64
    mask: 0xFFFE
    operands:
      - { name: ax, type: ax, bits: [0, 0] }
    semantics: { type: asr, flags: [N, Z, C] }

  - name: LSL64_ACC_P_SHIFT
    full_name: "Logical shift left 64-bit ACC:P by immediate"
    # Shift field is 4 bits (0-15) per TI SPRU430F and INL bn-tic28x-arch
    # reference (MASK_FFF0). The previous mask 0xFFE0 / imm5 allowed bit 4
    # as part of the shift, which shadowed the entire 0x56B0-0x56BF range
    # used by 32-bit MOVB_LOC16_CONST8_COND in the two-stage decoder.
    format: 16
    opcode: 0x56A0
    mask: 0xFFF0
    operands:
      - { name: shift, type: imm4, bits: [3, 0] }
    semantics: { type: lsl, dest: "ACC:P", flags: [N, Z, C] }

  - name: LSL64_ACC_P_T
    full_name: "Logical shift left 64-bit ACC:P by T register"
    format: 16
    opcode: 0x5652
    mask: 0xFFFF
    semantics: { type: lsl, dest: "ACC:P", src: T, flags: [N, Z, C] }

  - name: LSR64_ACC_P_SHIFT
    full_name: "Logical shift right 64-bit ACC:P by immediate"
    # See LSL64_ACC_P_SHIFT — same 4-bit shift field per TI/INL.
    format: 16
    opcode: 0x5690
    mask: 0xFFF0
    operands:
      - { name: shift, type: imm4, bits: [3, 0] }
    semantics: { type: lsr, dest: "ACC:P", flags: [N, Z, C] }

  - name: LSR64_ACC_P_T
    full_name: "Logical shift right 64-bit ACC:P by T register"
    format: 16
    opcode: 0x565B
    mask: 0xFFFF
    semantics: { type: lsr, dest: "ACC:P", src: T, flags: [N, Z, C] }

  - name: ASR64_ACC_P_SHIFT
    full_name: "Arithmetic shift right 64-bit ACC:P by immediate"
    # See LSL64_ACC_P_SHIFT — same 4-bit shift field per TI/INL.
    format: 16
    opcode: 0x5680
    mask: 0xFFF0
    operands:
      - { name: shift, type: imm4, bits: [3, 0] }
    semantics: { type: asr, dest: "ACC:P", flags: [N, Z, C] }

  - name: ASR64_ACC_P_T
    full_name: "Arithmetic shift right 64-bit ACC:P by T register"
    format: 16
    opcode: 0x562C
    mask: 0xFFFF
    semantics: { type: asr, dest: "ACC:P", src: T, flags: [N, Z, C] }

  - name: LSLL_ACC_T
    full_name: "Logical shift left ACC by T (long)"
    format: 16
    opcode: 0x5610
    mask: 0xFFFF
    semantics: { type: lsl, dest: ACC, src: T, flags: [N, Z, C] }

  - name: LSRL_ACC_T
    full_name: "Logical shift right ACC by T (long)"
    format: 16
    opcode: 0x5622
    mask: 0xFFFF
    semantics: { type: lsr, dest: ACC, src: T, flags: [N, Z, C] }

  - name: ASRL_ACC_T
    full_name: "Arithmetic shift right ACC by T (long)"
    format: 16
    opcode: 0x563B
    mask: 0xFFFF
    semantics: { type: asr, dest: ACC, src: T, flags: [N, Z, C] }

  - name: SFR_ACC_SHIFT
    full_name: "Shift ACC right by immediate"
    format: 16
    opcode: 0xFF40
    mask: 0xFFF0
    operands:
      - { name: shift, type: imm4, bits: [3, 0] }
    semantics: { type: asr, dest: ACC, flags: [N, Z, C] }

  - name: SFR_ACC_T
    full_name: "Shift ACC right by T register"
    format: 16
    opcode: 0xFF51
    mask: 0xFFFF
    semantics: { type: asr, dest: ACC, src: T, flags: [N, Z, C] }

  - name: FLIP_AX
    full_name: "Flip bit ordering of AX"
    format: 16
    opcode: 0x5670
    mask: 0xFFFE
    operands:
      - { name: ax, type: ax, bits: [0, 0] }
    semantics: { type: flip, dest: "AX", flags: [N, Z] }
