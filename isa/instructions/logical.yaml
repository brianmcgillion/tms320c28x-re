  # NOT
  - name: NOT_ACC
    full_name: "Bitwise NOT of ACC"
    format: 16
    opcode: 0xFF55
    mask: 0xFFFF
    semantics: { type: not, dest: ACC, flags: [N, Z] }

  - name: NOT_AX
    full_name: "Bitwise NOT of AX"
    format: 16
    opcode: 0xFF5E
    mask: 0xFFFE
    operands:
      - { name: ax, type: ax, bits: [0, 0] }
    semantics: { type: not, flags: [N, Z] }

  - name: AND_AX_LOC16_CONST16
    full_name: "AND AX with loc16 masked by const16"
    format: 32
    opcode: 0xCC000000
    mask: 0xFE000000
    objmode: 1
    operands:
      - { name: ax, type: ax, bits: [24, 24] }
      - { name: loc16, type: loc16, bits: [23, 16] }
      - { name: const16, type: imm16, bits: [15, 0] }
    semantics: { type: and, flags: [N, Z] }
