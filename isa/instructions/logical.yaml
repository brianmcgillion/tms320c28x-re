  - name: XOR_AX_LOC16
    full_name: "XOR AX with loc16"
    format: 16
    opcode: 0x7000
    mask: 0xFE00
    objmode: 1
    operands:
      - { name: ax, type: ax, bits: [8, 8] }
      - { name: loc16, type: loc16, bits: [7, 0] }
    semantics: { type: xor, flags: [N, Z] }

  - name: XOR_LOC16_AX
    full_name: "XOR loc16 with AX"
    format: 16
    opcode: 0xF200
    mask: 0xFE00
    objmode: 1
    operands:
      - { name: loc16, type: loc16, bits: [7, 0] }
      - { name: ax, type: ax, bits: [8, 8] }
    semantics: { type: xor, flags: [N, Z] }

  - name: XOR_ACC_CONST16_SHIFT0_15
    full_name: "XOR ACC with shifted 16-bit constant"
    format: 32
    opcode: 0x3E200000
    mask: 0xFFF00000
    objmode: 1
    operands:
      - { name: const16, type: imm16, bits: [15, 0] }
      - { name: shift, type: shift4, bits: [19, 16] }
    semantics: { type: xor, dest: ACC, flags: [N, Z] }

  - name: XOR_LOC16_CONST16
    full_name: "XOR loc16 with 16-bit constant"
    format: 32
    opcode: 0x1C000000
    mask: 0xFF000000
    objmode: 1
    operands:
      - { name: loc16, type: loc16, bits: [23, 16] }
      - { name: const16, type: imm16, bits: [15, 0] }
