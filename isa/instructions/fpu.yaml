# TMS320C28x FPU32 Instructions
# Opcodes from INL bn-tic28x-arch opcodes.h (MIT)

instructions:
  - name: ABSF32_RAH_RBH
    full_name: "Absolute value of float32"
    format: 32
    opcode: 0xE6950000
    mask: 0xFFFF0000
    operands:
      - { name: rah, type: fpu_reg, bits: [2, 0] }
      - { name: rbh, type: fpu_reg, bits: [5, 3] }
    semantics: { type: fpu }

  - name: ADDF32_RAH_RBH_RCH
    full_name: "Add two float32 values"
    format: 32
    opcode: 0xE7100000
    mask: 0xFFF00000
    operands:
      - { name: rah, type: fpu_reg, bits: [2, 0] }
      - { name: rbh, type: fpu_reg, bits: [5, 3] }
      - { name: rch, type: fpu_reg, bits: [8, 6] }
    semantics: { type: fpu }

  - name: CMPF32_RAH_RBH
    full_name: "Compare two float32 values"
    format: 32
    opcode: 0xE6940000
    mask: 0xFFFF0000
    operands:
      - { name: rah, type: fpu_reg, bits: [2, 0] }
      - { name: rbh, type: fpu_reg, bits: [5, 3] }
    semantics: { type: fpu }

  - name: CMPF32_RAH_0
    full_name: "Compare float32 with zero"
    format: 16
    opcode: 0xE5A0
    mask: 0xFFF8
    operands:
      - { name: rah, type: fpu_reg, bits: [2, 0] }
    semantics: { type: fpu }

  - name: EINVF32_RAH_RBH
    full_name: "Estimate inverse of float32"
    format: 32
    opcode: 0xE6930000
    mask: 0xFFFF0000
    operands:
      - { name: rah, type: fpu_reg, bits: [2, 0] }
      - { name: rbh, type: fpu_reg, bits: [5, 3] }
    semantics: { type: fpu }

  - name: EISQRTF32_RAH_RBH
    full_name: "Estimate inverse square root of float32"
    format: 32
    opcode: 0xE6920000
    mask: 0xFFFF0000
    operands:
      - { name: rah, type: fpu_reg, bits: [2, 0] }
      - { name: rbh, type: fpu_reg, bits: [5, 3] }
    semantics: { type: fpu }

  - name: F32TOI16_RAH_RBH
    full_name: "Convert float32 to signed int16"
    format: 32
    opcode: 0xE68C0000
    mask: 0xFFFF8000
    operands:
      - { name: rah, type: fpu_reg, bits: [2, 0] }
      - { name: rbh, type: fpu_reg, bits: [5, 3] }
    semantics: { type: fpu }

  - name: F32TOI16R_RAH_RBH
    full_name: "Convert float32 to signed int16 with rounding"
    format: 32
    opcode: 0xE68C8000
    mask: 0xFFFF8000
    operands:
      - { name: rah, type: fpu_reg, bits: [2, 0] }
      - { name: rbh, type: fpu_reg, bits: [5, 3] }
    semantics: { type: fpu }

  - name: F32TOI32_RAH_RBH
    full_name: "Convert float32 to signed int32"
    format: 32
    opcode: 0xE6880000
    mask: 0xFFFF0000
    operands:
      - { name: rah, type: fpu_reg, bits: [2, 0] }
      - { name: rbh, type: fpu_reg, bits: [5, 3] }
    semantics: { type: fpu }

  - name: F32TOUI16_RAH_RBH
    full_name: "Convert float32 to unsigned int16"
    format: 32
    opcode: 0xE68E0000
    mask: 0xFFFF8000
    operands:
      - { name: rah, type: fpu_reg, bits: [2, 0] }
      - { name: rbh, type: fpu_reg, bits: [5, 3] }
    semantics: { type: fpu }

  - name: F32TOUI16R_RAH_RBH
    full_name: "Convert float32 to unsigned int16 with rounding"
    format: 32
    opcode: 0xE68E8000
    mask: 0xFFFF8000
    operands:
      - { name: rah, type: fpu_reg, bits: [2, 0] }
      - { name: rbh, type: fpu_reg, bits: [5, 3] }
    semantics: { type: fpu }

  - name: F32TOUI32_RAH_RBH
    full_name: "Convert float32 to unsigned int32"
    format: 32
    opcode: 0xE68A0000
    mask: 0xFFFF0000
    operands:
      - { name: rah, type: fpu_reg, bits: [2, 0] }
      - { name: rbh, type: fpu_reg, bits: [5, 3] }
    semantics: { type: fpu }

  - name: FRACF32_RAH_RBH
    full_name: "Fractional part of float32"
    format: 32
    opcode: 0xE6F10000
    mask: 0xFFFF0000
    operands:
      - { name: rah, type: fpu_reg, bits: [2, 0] }
      - { name: rbh, type: fpu_reg, bits: [5, 3] }
    semantics: { type: fpu }

  - name: I16TOF32_RAH_RBH
    full_name: "Convert signed int16 to float32"
    format: 32
    opcode: 0xE68D0000
    mask: 0xFFFF0000
    operands:
      - { name: rah, type: fpu_reg, bits: [2, 0] }
      - { name: rbh, type: fpu_reg, bits: [5, 3] }
    semantics: { type: fpu }

  - name: I16TOF32_RAH_MEM16
    full_name: "Convert signed int16 from memory to float32"
    format: 32
    opcode: 0xE2C80000
    mask: 0xFFF80000
    operands:
      - { name: rah, type: fpu_reg, bits: [18, 16] }
      - { name: mem16, type: loc16, bits: [7, 0] }
    semantics: { type: fpu }

  - name: UI16TOF32_RAH_MEM16
    full_name: "Convert unsigned int16 from memory to float32"
    format: 32
    opcode: 0xE2C00000
    mask: 0xFFF80000
    operands:
      - { name: rah, type: fpu_reg, bits: [18, 16] }
      - { name: mem16, type: loc16, bits: [7, 0] }
    semantics: { type: fpu }

  - name: F32TOI32_RAH_MEM32
    full_name: "Convert float32 from memory to signed int32"
    format: 32
    opcode: 0xE2000000
    mask: 0xFFF80000
    operands:
      - { name: rah, type: fpu_reg, bits: [18, 16] }
      - { name: mem32, type: loc32, bits: [7, 0] }
    semantics: { type: fpu }

  - name: F32TOUI32_RAH_MEM32
    full_name: "Convert float32 from memory to unsigned int32"
    format: 32
    opcode: 0xE2800000
    mask: 0xFFF80000
    operands:
      - { name: rah, type: fpu_reg, bits: [18, 16] }
      - { name: mem32, type: loc32, bits: [7, 0] }
    semantics: { type: fpu }

  - name: I32TOF32_RAH_RBH
    full_name: "Convert signed int32 to float32"
    format: 32
    opcode: 0xE6890000
    mask: 0xFFFF0000
    operands:
      - { name: rah, type: fpu_reg, bits: [2, 0] }
      - { name: rbh, type: fpu_reg, bits: [5, 3] }
    semantics: { type: fpu }

  - name: I32TOF32_RAH_MEM32
    full_name: "Convert signed int32 from memory to float32"
    format: 32
    opcode: 0xE2880000
    mask: 0xFFF80000
    operands:
      - { name: rah, type: fpu_reg, bits: [18, 16] }
      - { name: mem32, type: loc32, bits: [7, 0] }
    semantics: { type: fpu }

  # UI32TOF32 memory form is leading word 0xE284 (dis2000), inside the
  # 0xE280/0xFFF8 F32TOUI32 range; this full-word pattern (popcount 16) wins.
  - name: UI32TOF32_RAH_MEM32
    full_name: "Convert unsigned int32 from memory to float32"
    format: 32
    opcode: 0xE2840000
    mask: 0xFFFF0000
    operands:
      - { name: rah, type: fpu_reg, bits: [18, 16] }
      - { name: mem32, type: loc32, bits: [7, 0] }
    semantics: { type: fpu }

  - name: UI32TOF32_RAH_RBH
    full_name: "Convert unsigned int32 to float32"
    format: 32
    opcode: 0xE68B0000
    mask: 0xFFFF0000
    operands:
      - { name: rah, type: fpu_reg, bits: [2, 0] }
      - { name: rbh, type: fpu_reg, bits: [5, 3] }
    semantics: { type: fpu }

  - name: UI16TOF32_RAH_RBH
    full_name: "Convert unsigned int16 to float32"
    format: 32
    opcode: 0xE68F0000
    mask: 0xFFFF0000
    operands:
      - { name: rah, type: fpu_reg, bits: [2, 0] }
      - { name: rbh, type: fpu_reg, bits: [5, 3] }
    semantics: { type: fpu }

  - name: MAXF32_RAH_RBH
    full_name: "Maximum of two float32 values"
    format: 32
    opcode: 0xE6960000
    mask: 0xFFFF0000
    operands:
      - { name: rah, type: fpu_reg, bits: [2, 0] }
      - { name: rbh, type: fpu_reg, bits: [5, 3] }
    semantics: { type: fpu }

  - name: MINF32_RAH_RBH
    full_name: "Minimum of two float32 values"
    format: 32
    opcode: 0xE6970000
    mask: 0xFFFF0000
    operands:
      - { name: rah, type: fpu_reg, bits: [2, 0] }
      - { name: rbh, type: fpu_reg, bits: [5, 3] }
    semantics: { type: fpu }

  # --- FPU arithmetic (3-register) ---
  - name: MPYF32_RAH_RBH_RCH
    full_name: "Multiply two float32 values"
    format: 32
    opcode: 0xE7000000
    mask: 0xFFF00000
    operands:
      - { name: rah, type: fpu_reg, bits: [2, 0] }
      - { name: rbh, type: fpu_reg, bits: [5, 3] }
      - { name: rch, type: fpu_reg, bits: [8, 6] }
    semantics: { type: fpu }

  - name: SUBF32_RAH_RBH_RCH
    full_name: "Subtract two float32 values"
    format: 32
    opcode: 0xE7200000
    mask: 0xFFF00000
    operands:
      - { name: rah, type: fpu_reg, bits: [2, 0] }
      - { name: rbh, type: fpu_reg, bits: [5, 3] }
      - { name: rch, type: fpu_reg, bits: [8, 6] }
    semantics: { type: fpu }

  - name: MPYF32_ADDF32_PAR
    full_name: "Multiply and add float32 in parallel"
    format: 32
    opcode: 0xE7400000
    mask: 0xFFF00000
    operands:
      - { name: rah, type: fpu_reg, bits: [2, 0] }
      - { name: rbh, type: fpu_reg, bits: [5, 3] }
      - { name: rch, type: fpu_reg, bits: [8, 6] }
    semantics: { type: fpu_parallel }

  - name: MACF32_RAH_RBH_RCH
    full_name: "Multiply accumulate float32"
    format: 32
    opcode: 0xE7500000
    mask: 0xFFF00000
    operands:
      - { name: rah, type: fpu_reg, bits: [2, 0] }
      - { name: rbh, type: fpu_reg, bits: [5, 3] }
      - { name: rch, type: fpu_reg, bits: [8, 6] }
    semantics: { type: fpu }

  - name: MOV32_RAH_RBH
    full_name: "Move FPU register to register (conditional)"
    format: 32
    opcode: 0xE6C00000
    mask: 0xFFF0FFC0
    operands:
      - { name: rah, type: fpu_reg, bits: [2, 0] }
      - { name: rbh, type: fpu_reg, bits: [5, 3] }
      - { name: cndf, type: cond4, bits: [19, 16] }
    semantics: { type: fpu }

  # MOV32 between FPU register and CPU register / ACC / P (leading word
  # 0xBDAx = load to FPU reg, 0xBFAx = store from FPU reg; dis2000).  selector
  # x picks XAR0-7 (0-7), ACC (9) or P (b).  Previously stolen by
  # MOV_ABS16_LOC16 (0xBD000000 / 0xFF000000, popcount 8); these 0xFFF00000
  # patterns (popcount 12) win the tie and decode to MOV32.
  - name: MOV32_RAH_CPUREG
    full_name: "Move CPU register/ACC/P to FPU register"
    format: 32
    opcode: 0xBDA00000
    mask: 0xFFF00000
    operands:
      - { name: rah, type: fpu_reg, bits: [6, 4] }
    semantics: { type: fpu }

  - name: MOV32_CPUREG_RAH
    full_name: "Move FPU register to CPU register/ACC/P"
    format: 32
    opcode: 0xBFA00000
    mask: 0xFFF00000
    operands:
      - { name: rah, type: fpu_reg, bits: [6, 4] }
    semantics: { type: fpu }

  - name: ZERO
    full_name: "Zero float32 register"
    format: 16
    opcode: 0xE590
    mask: 0xFFF8
    operands:
      - { name: rah, type: fpu_reg, bits: [2, 0] }
    semantics: { type: fpu }

  # --- FPU parallel instructions (32-bit: op || MOV32, dis2000 shows 2 words) ---
  # Leading word 0xE3xx (|| MOV32 load) and 0xE0xx (|| MOV32 store).
  # Sub-op by word1 low nibble-high:  x0-x0F MPYF32, x10-x1F ADDF32, x20-x2F SUBF32.
  - name: MPYF32_MOV32_LOAD
    full_name: "Multiply float32 || Move memory to FPU register"
    format: 32
    opcode: 0xE3000000
    mask: 0xFFF00000
    operands:
      - { name: rah, type: fpu_reg, bits: [2, 0] }
      - { name: rbh, type: fpu_reg, bits: [5, 3] }
      - { name: rch, type: fpu_reg, bits: [8, 6] }
    semantics: { type: fpu_parallel }

  - name: ADDF32_MOV32_LOAD
    full_name: "Add float32 || Move memory to FPU register"
    format: 32
    opcode: 0xE3100000
    mask: 0xFFF00000
    operands:
      - { name: rah, type: fpu_reg, bits: [2, 0] }
      - { name: rbh, type: fpu_reg, bits: [5, 3] }
      - { name: rch, type: fpu_reg, bits: [8, 6] }
    semantics: { type: fpu_parallel }

  - name: SUBF32_MOV32_LOAD
    full_name: "Subtract float32 || Move memory to FPU register"
    format: 32
    opcode: 0xE3200000
    mask: 0xFFF00000
    operands:
      - { name: rah, type: fpu_reg, bits: [2, 0] }
      - { name: rbh, type: fpu_reg, bits: [5, 3] }
      - { name: rch, type: fpu_reg, bits: [8, 6] }
    semantics: { type: fpu_parallel }

  - name: MPYF32_MOV32_STORE
    full_name: "Multiply float32 || Store FPU register to memory"
    format: 32
    opcode: 0xE0000000
    mask: 0xFFF00000
    operands:
      - { name: rah, type: fpu_reg, bits: [2, 0] }
      - { name: rbh, type: fpu_reg, bits: [5, 3] }
      - { name: rch, type: fpu_reg, bits: [8, 6] }
    semantics: { type: fpu_parallel }

  - name: ADDF32_MOV32_STORE
    full_name: "Add float32 || Store FPU register to memory"
    format: 32
    opcode: 0xE0100000
    mask: 0xFFF00000
    operands:
      - { name: rah, type: fpu_reg, bits: [2, 0] }
      - { name: rbh, type: fpu_reg, bits: [5, 3] }
      - { name: rch, type: fpu_reg, bits: [8, 6] }
    semantics: { type: fpu_parallel }

  - name: SUBF32_MOV32_STORE
    full_name: "Subtract float32 || Store FPU register to memory"
    format: 32
    opcode: 0xE0200000
    mask: 0xFFF00000
    operands:
      - { name: rah, type: fpu_reg, bits: [2, 0] }
      - { name: rbh, type: fpu_reg, bits: [5, 3] }
      - { name: rch, type: fpu_reg, bits: [8, 6] }
    semantics: { type: fpu_parallel }

  - name: ADDF32_MOV32_PAR
    full_name: "Add float32 || Move memory to/from FPU register"
    format: 16
    opcode: 0xE100
    mask: 0xFF00
    operands:
      - { name: mode, type: imm8, bits: [7, 0] }
    semantics: { type: fpu_parallel }

  # NOTE: 0xB800-0xBBFF is NOT SUBF32 — dis2000 decodes this entire range as
  # MOVZ DP, #10bit (verified: 604/604 occurrences across the firmware). FPU32
  # SUBF32 memory forms live in the 0xE0-0xEF leading-word space. The two old
  # 0xB800/0xB900 0xFF00 catch-alls only ever mis-decoded MOVZ DP (1 in code,
  # the rest constant-table data) — removed. The real instruction is
  # MOVZ_DP_CONST10 (opcode 0xB800, mask 0xFC00) in mov.yaml.

  # NEGF32 RaH, RbH, CNDF is leading word 0xE6Ax (cndf in word1[3:0]); it is a
  # 32-bit op.  dis2000 shows e6a0-e6af is ALWAYS NEGF32 (240 insns); the old
  # 0xE400/0xFF00 16-bit entry only mis-decoded e4xx .word data.
  - name: NEGF32_RAH_RBH
    full_name: "Negate float32 register (conditional)"
    format: 32
    opcode: 0xE6A00000
    mask: 0xFFF00000
    operands:
      - { name: rah, type: fpu_reg, bits: [2, 0] }
      - { name: rbh, type: fpu_reg, bits: [5, 3] }
      - { name: cndf, type: cond4, bits: [19, 16] }
    semantics: { type: fpu }

  - name: FPU_E9_OP
    full_name: "FPU extended operation"
    format: 16
    opcode: 0xE900
    mask: 0xFF00
    operands:
      - { name: mode, type: imm8, bits: [7, 0] }
    semantics: { type: fpu }

  - name: MOVST0_FLAG
    full_name: "Move FPU status flags to CPU ST0"
    format: 16
    opcode: 0xE6B0
    mask: 0xFFFF
    semantics: { type: fpu }

  - name: SWAPF_RAH_RBH
    full_name: "Swap two FPU registers"
    format: 16
    opcode: 0xE641
    mask: 0xFFFF
    semantics: { type: fpu }

  # --- FPU 32-bit ops with #16FHi immediate (leading word 0xE8xx) ---
  # opcode32 = word1<<16 | word2.  word1 = 1110 1000 ssss .... selects the op;
  # the immediate / register fields live across both words.  These MUST be
  # 32-bit (2 words); a loose 0xE800/0xFF00 16-bit pattern previously shadowed
  # them as a 1-word MOV32.  Sub-opcode ranges (dis2000, whole firmware):
  #   E800-E807 MOVIZ   E808-E80F MOVXI   E810-E817 CMPF32   E820-E827 MAXF32
  #   E840-E87F MPYF32  E880-E8BF ADDF32  E8C0-E8FF SUBF32
  - name: MOVIZ
    full_name: "Load high 16 bits of FPU register with immediate"
    format: 32
    opcode: 0xE8000000
    mask: 0xFFF80000
    operands:
      - { name: rah, type: fpu_reg, bits: [2, 0] }
      - { name: imm, type: imm16, bits: [18, 6] }
    semantics: { type: fpu }

  - name: MOVXI
    full_name: "Load low 16 bits of FPU register with immediate"
    format: 32
    opcode: 0xE8080000
    mask: 0xFFF80000
    operands:
      - { name: rah, type: fpu_reg, bits: [2, 0] }
      - { name: imm, type: imm16, bits: [18, 6] }
    semantics: { type: fpu }

  - name: CMPF32_RAH_16FHI
    full_name: "Compare FPU register with 16-bit float immediate"
    format: 32
    opcode: 0xE8100000
    mask: 0xFFF80000
    operands:
      - { name: rah, type: fpu_reg, bits: [18, 16] }
      - { name: imm, type: imm16, bits: [15, 0] }
    semantics: { type: fpu }

  - name: MAXF32_RAH_16FHI
    full_name: "Maximum of FPU register and 16-bit float immediate"
    format: 32
    opcode: 0xE8200000
    mask: 0xFFF80000
    operands:
      - { name: rah, type: fpu_reg, bits: [18, 16] }
      - { name: imm, type: imm16, bits: [15, 0] }
    semantics: { type: fpu }

  - name: MPYF32_RAH_16FHI_RBH
    full_name: "Multiply FPU register by 16-bit float immediate"
    format: 32
    opcode: 0xE8400000
    mask: 0xFFC00000
    operands:
      - { name: rah, type: fpu_reg, bits: [2, 0] }
      - { name: rbh, type: fpu_reg, bits: [5, 3] }
      - { name: imm, type: imm16, bits: [15, 6] }
    semantics: { type: fpu }

  - name: ADDF32_RAH_16FHI_RBH
    full_name: "Add FPU register and 16-bit float immediate"
    format: 32
    opcode: 0xE8800000
    mask: 0xFFC00000
    operands:
      - { name: rah, type: fpu_reg, bits: [2, 0] }
      - { name: rbh, type: fpu_reg, bits: [5, 3] }
      - { name: imm, type: imm16, bits: [15, 6] }
    semantics: { type: fpu }

  - name: SUBF32_RAH_16FHI_RBH
    full_name: "Subtract 16-bit float immediate from FPU register"
    format: 32
    opcode: 0xE8C00000
    mask: 0xFFC00000
    operands:
      - { name: rah, type: fpu_reg, bits: [2, 0] }
      - { name: rbh, type: fpu_reg, bits: [5, 3] }
      - { name: imm, type: imm16, bits: [15, 6] }
    semantics: { type: fpu }

  - name: F32_CONV_MEM_DA
    full_name: "FPU memory conversion"
    format: 16
    opcode: 0xE2DA
    mask: 0xFFFF
    semantics: { type: fpu }

  # --- FPU MOV32 memory load/store ---
  - name: MOV32_RAH_MEM32
    full_name: "Move 32-bit memory to FPU register (conditional)"
    format: 32
    opcode: 0xE2A00000
    mask: 0xFFF0F800
    operands:
      - { name: rah, type: fpu_reg, bits: [10, 8] }
      - { name: mem32, type: loc32, bits: [7, 0] }
      - { name: cndf, type: cond4, bits: [19, 16] }
    semantics: { type: fpu }

  - name: MOV32_MEM32_RAH
    full_name: "Move FPU register to 32-bit memory"
    format: 32
    opcode: 0xE2030000
    mask: 0xFFFFF800
    operands:
      - { name: mem32, type: loc32, bits: [7, 0] }
      - { name: rah, type: fpu_reg, bits: [10, 8] }
    semantics: { type: fpu }

  # NOTE: 0xE6Ax is NEGF32 in this firmware (see NEGF32_RAH_RBH above), not a
  # conditional MOV32 store -- no conditional MOV32-to-memory appears anywhere in
  # dis2000.  The old 0xE6A00000 entry only shadowed NEGF32, so it is parked on
  # an encoding that never occurs (and would be padding, skipped by the gate).
  # The real conditional MOV32 *load* is handled by MOV32_RAH_MEM32 (0xE2A0).
  - name: MOV32_MEM32_RAH_COND
    full_name: "Move FPU register to 32-bit memory (conditional)"
    format: 32
    opcode: 0xFFFF0000
    mask: 0xFFFF0000
    operands:
      - { name: mem32, type: loc32, bits: [7, 0] }
      - { name: rah, type: fpu_reg, bits: [10, 8] }
      - { name: cndf, type: cond4, bits: [19, 16] }
    semantics: { type: fpu }

  # Real STF memory moves are leading word 0xE200 / 0xE280 (dis2000), NOT
  # 0xE800 / 0xE500.  The old loose 0xFF00 masks here shadowed the 0xE8xx
  # (#16FHi FPU ops) and 0xE5xx (ZERO/CMPF32/V-ops) ranges as 1-word MOV32.
  - name: MOV32_MEM32_STF
    full_name: "Move FPU status flags to memory"
    format: 32
    opcode: 0xE2000000
    mask: 0xFFFF0000
    operands:
