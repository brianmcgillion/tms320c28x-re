name: Release
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: libtms320c28x_binja.so
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: libtms320c28x_binja.dylib
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: tms320c28x_binja.dll
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # cmake + ninja needed by binaryninjacore-sys to build stub library
      - name: Install build deps (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build libclang-dev
      - name: Install build deps (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake ninja
      - name: Install build deps (Windows)
        if: runner.os == 'Windows'
        run: choco install cmake ninja llvm -y

      - name: Build native plugin
        # DESTDIR: the BN stub's CMakeLists installs its library onto itself and
        # destroys it in the process. See scripts/run_all_tests.sh.
        run: cargo build --release --manifest-path rust/Cargo.toml --target ${{ matrix.target }} --no-default-features
        env:
          DESTDIR: ${{ runner.temp }}/bn-stub

      - name: Package plugin
        shell: bash
        env:
          BUILD_TARGET: ${{ matrix.target }}
          ARTIFACT_NAME: ${{ matrix.artifact }}
        run: |
          mkdir -p dist/tms320c28x
          # Every module, by glob. The hand-written list this replaces omitted
          # memmap.py, patterns.py and dis_sidecar.py -- and flash.py:27 and
          # tools.py:23 both do `from .memmap import ...`, so every published
          # archive raised ImportError on load. scripts/package.sh:62 has had
          # the glob, and a comment warning about exactly this, all along.
          cp binja/*.py binja/plugin.json dist/tms320c28x/
          cp "rust/target/${BUILD_TARGET}/release/${ARTIFACT_NAME}" dist/tms320c28x/

      - name: Create archive
        shell: bash
        env:
          BUILD_TARGET: ${{ matrix.target }}
        run: |
          cd dist
          if [[ "$BUILD_TARGET" == *windows* ]]; then
            7z a "../tms320c28x-${BUILD_TARGET}.zip" tms320c28x/
          else
            zip -r "../tms320c28x-${BUILD_TARGET}.zip" tms320c28x/
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: tms320c28x-${{ matrix.target }}
          path: "tms320c28x-${{ matrix.target }}.zip"

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: 'tms320c28x-*.zip'
          generate_release_notes: true
