[package]
name = "tms320c28x-binja"
version = "0.1.0"
edition = "2021"
description = "TMS320C28x architecture plugin for Binary Ninja (Rust)"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[features]
default = ["bn-link"]
# Enable to link against a real Binary Ninja installation.
# Disable (--no-default-features) for CI builds that use stubs.
bn-link = ["binaryninja/core"]

[dependencies]
# Pinned to ABI 187 to match BN 6.1.10603 (rev from its api_REVISION.txt)
# default-features = false so our bn-link feature controls the "core" flag
binaryninja = { git = "https://github.com/Vector35/binaryninja-api", rev = "b6cdbaf9e8d2c0e3f4d688b24982377e9da1e02e", default-features = false }
log = "0.4"

[build-dependencies]
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
