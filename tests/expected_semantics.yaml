# Expected semantic properties for all 28 test binaries.
# Used by scripts/validate_functional.py for functional equivalence checking.
#
# Legacy checks (flat booleans — backward compat):
#   exists, has_loop, has_conditional, has_stores, has_calls,
#   has_float_ops, has_body, has_arithmetic, has_mask
#
# Functional checks (nested under 'functional:'):
#   callees: [list]           — expected function calls (BN API + HLIL regex)
#   no_callees: true          — must NOT call other functions
#   mmio_patterns: [regex]    — hex address patterns in stores
#   no_mmio_writes: true      — must NOT store to MMIO addresses
#   constants: [regex]        — numeric constants that must appear
#   comparison_constants: [regex] — constants near comparisons
#   loop_type: infinite|counted|conditional
#   arithmetic_ops: [ops]     — specific operators present
#   min_branches: N           — minimum if-statement count
#   min_stores: N             — minimum store operations
#   global_writes: [names]    — named globals that are written
#
# For COFF binaries, only 'exists' and decode quality checks run.

# ============================================================
# Synthetic fixtures (ELF, -O2, FPU32)
# ============================================================

led_blink.out:
  format: elf
  source: synthetic
  functions:
    delay:
      exists: true
      has_loop: true
      has_body: true
      functional:
        loop_type: counted
        no_mmio_writes: true
    gpio_toggle:
      exists: true
      has_stores: true
      has_body: true
      functional:
        mmio_patterns: ["0x[Dd][Ff]0[Cc]"]
        arithmetic_ops: ["<<"]
    main:
      exists: true
      has_loop: true
      has_calls: true
      has_body: true
      functional:
        callees: ["gpio_toggle", "delay"]
        loop_type: infinite

pid_loop.out:
  format: elf
  source: synthetic
  functions:
    pid_init:
      exists: true
      has_stores: true
      has_body: true
      functional:
        min_stores: 6
    pid_compute:
      exists: true
      has_conditional: true
      has_body: true
      has_float_ops: true
      functional:
        min_branches: 1
        arithmetic_ops: ["+", "-", "*"]
    run_pid_loop:
      exists: true
      has_body: true
      has_calls: true
      functional:
        callees: ["pid_init", "pid_compute"]
        loop_type: counted
        constants: ["0x64|100"]
    main:
      exists: true
      has_body: true
      functional:
        callees: ["run_pid_loop"]

switch_table.out:
  format: elf
  source: synthetic
  functions:
    process_command:
      exists: true
      has_conditional: true
      has_arithmetic: true
      has_body: true
      functional:
        min_branches: 4
        # >> may appear as ASR (arithmetic shift), << is in pointer math
        # & 0xF mask may be optimized away at -O2
        arithmetic_ops: ["+", "-", "&", "|", "^"]
    run_commands:
      exists: true
      has_loop: true
      has_calls: true
      has_body: true
      functional:
        callees: ["process_command"]
        loop_type: counted
        constants: ["0x2[Aa]|42", "\\b8\\b|0x8"]
    main:
      exists: true
      has_calls: true
      has_body: true
      functional:
        callees: ["run_commands"]

isr_handler.out:
  format: elf
  source: synthetic
  functions:
    buf_init:
      exists: true
      has_stores: true
      has_body: true
      functional:
        global_writes: ["rx_head", "rx_tail", "rx_count"]
        constants: ["\\b0\\b"]
    buf_put:
      exists: true
      has_conditional: true
      has_stores: true
      has_mask: true
      has_body: true
      functional:
        comparison_constants: ["0x10|16"]
        constants: ["0x[Ff]\\b"]
        arithmetic_ops: ["&", "+"]
    buf_get:
      exists: true
      has_conditional: true
      has_stores: true
      has_body: true
      functional:
        constants: ["0x[Ff]\\b"]
    sci_rx_isr:
      exists: true
      has_stores: true
      has_calls: true
      has_body: true
      functional:
        mmio_patterns: ["0x[Ee]0[Aa]0"]
        callees: ["buf_put"]
    process_received:
      exists: true
      has_loop: true
      has_calls: true
      has_body: true
      functional:
        callees: ["buf_get"]
        loop_type: conditional
        arithmetic_ops: ["+"]
    main:
      exists: true
      has_calls: true
      has_body: true
      functional:
        callees: ["buf_init", "process_received"]

